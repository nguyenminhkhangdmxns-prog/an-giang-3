<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cẩm Nang Du Lịch An Giang Chi Tiết A-Z - Khám Phá Vùng Đất Bảy Núi</title>
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: #f4f6f9;
            color: #2c3e50;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* Header & Navigation */
        header {
            background-color: #ffffff;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
        }
        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #1a252f;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .logo span {
            color: #27ae60;
        }
        nav ul {
            display: flex;
            list-style: none;
        }
        nav ul li {
            margin-left: 30px;
        }
        nav ul li a {
            font-weight: 600;
            color: #555;
            font-size: 15px;
            transition: color 0.3s, border-bottom 0.3s;
            padding-bottom: 5px;
        }
        nav ul li a:hover {
            color: #27ae60;
            border-bottom: 2px solid #27ae60;
        }

        /* Banner Hero Area */
        .banner {
            background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.5)), url('https://angiang.gov.vn');
            background-size: cover;
            background-position: center;
            height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 0 20px;
        }
        .banner h1 {
            font-size: 52px;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.7);
        }
        .banner p {
            font-size: 22px;
            max-width: 750px;
            text-shadow: 1px 2px 6px rgba(0,0,0,0.6);
            margin-bottom: 35px;
            font-weight: 300;
        }
        .btn-explore {
            background-color: #27ae60;
            color: white;
            padding: 14px 35px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
            transition: all 0.3s ease;
        }
        .btn-explore:hover {
            background-color: #219653;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.6);
        }

        /* Main Container Layout */
        .container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }
        
        section {
            margin-bottom: 80px;
        }
        
        .section-title {
            text-align: center;
            font-size: 36px;
            color: #2c3e50;
            margin-bottom: 45px;
            font-weight: 800;
        }
        .section-title span {
            color: #27ae60;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 5px;
            background-color: #27ae60;
            margin: 12px auto 0;
            border-radius: 3px;
        }

        /* Introduction Section */
        .intro-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 40px;
        }
        .intro-text {
            flex: 1.2;
        }
        .intro-text p {
            margin-bottom: 18px;
            color: #555;
            font-size: 16px;
            text-align: justify;
        }
        .intro-img {
            flex: 1;
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            height: 350px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Grid Destinations Cards */
        .grid-destinations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 30px;
        }
        .card {
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.12);
        }
        .card-img-wrapper {
            position: relative;
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .card:hover .card-img-wrapper img {
            transform: scale(1.08);
        }
        .card-body {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .location-tag {
            align-self: flex-start;
            background: #e8f8f0;
            color: #27ae60;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .card-desc {
            color: #666;
            font-size: 14.5px;
            text-align: justify;
        }

        /* Culture / Festivals Highlight Section */
        .culture-box {
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: white;
            border-radius: 16px;
            padding: 40px;
            margin-top: 20px;
        }
        .culture-title {
            font-size: 26px;
            color: #27ae60;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .culture-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .culture-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #27ae60;
        }
        .culture-item h4 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #fff;
        }
        .culture-item p {
            font-size: 14px;
            color: #cbd5e0;
        }

        /* Cuisine Food Gallery Section */
        .cuisine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }
        .cuisine-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            transition: transform 0.3s;
        }
        .cuisine-card:hover {
            transform: scale(1.03);
        }
        .cuisine-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .cuisine-name {
            font-weight: 700;
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .cuisine-taste {
            font-size: 13px;
            color: #7f8c8d;
            font-style: italic;
        }

        /* Footer */
        footer {
            background-color: #1a252f;
            color: #94a3b8;
            padding: 50px 20px;
            text-align: center;
            font-size: 14.5px;
            border-top: 4px solid #27ae60;
        }
        footer p {
            margin-bottom: 12px;
        }
        footer a {
            color: #27ae60;
            font-weight: bold;
            transition: color 0.3s;
        }
        footer a:hover {
            color: #2ecc71;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .intro-box {
                flex-direction: column;
            }
            .banner h1 {
                font-size: 40px;
            }
        }
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
            }
            nav ul li {
                margin: 0 12px;
            }
            .banner h1 {
                font-size: 32px;
            }
            .banner p {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- Header & Menu -->
    <header>
        <div class="nav-container">
            <div class="logo"><a href="#">An Giang<span> Địa Chí</span></a></div>
            <nav>
                <ul>
                    <li><a href="#tong-quan">Tổng Quan</a></li>
